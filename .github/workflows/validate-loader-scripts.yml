name: Validate Loader Scripts

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/**/*.user.js'
      - 'tools/validate-loader-scripts.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate loader compatibility
        run: node tools/validate-loader-scripts.mjs
