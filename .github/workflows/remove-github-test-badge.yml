name: Remove temporary GitHub test badge

on:
  push:
    paths:
      - '.github/workflows/remove-github-test-badge.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove-badge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove temporary badge
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('scripts/note-youtube-read-marker.user.js')
          text = path.read_text(encoding='utf-8-sig')

          text = text.replace(",\n        githubBadge: 'rm196-github-badge'", "")
          text = re.sub(r"\n\s*#\$\{ID\.githubBadge\}\{.*?\n\s*\}", "", text, flags=re.S)
          text = re.sub(r"\n\s*const ensureGithubBadge = \(\) => \{.*?\n\s*\};", "", text, flags=re.S)
          text = text.replace("\n        ensureGithubBadge();", "")

          path.write_text(text, encoding='utf-8-sig', newline='\n')
          PY
      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/note-youtube-read-marker.user.js
          git commit -m "Remove temporary GitHub test badge"
          git push
