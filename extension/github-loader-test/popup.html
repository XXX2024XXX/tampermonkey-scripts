<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub自動読込テスト</title>
  <style>
    body { width: 320px; margin: 0; padding: 16px; font-family: sans-serif; background: #fff; color: #111; }
    h1 { margin: 0 0 12px; font-size: 18px; }
    .row { margin: 8px 0; line-height: 1.5; word-break: break-word; }
    .label { font-weight: 700; }
    #status.ok { color: #087f23; }
    #status.error { color: #b00020; }
  </style>
</head>
<body>
  <h1>GitHub自動読込テスト</h1>
  <div class="row"><span class="label">状態：</span><span id="status">確認中</span></div>
  <div class="row"><span class="label">使用コード：</span><span id="source">-</span></div>
  <div class="row"><span class="label">バージョン：</span><span id="version">-</span></div>
  <div class="row"><span class="label">最終処理：</span><span id="updatedAt">-</span></div>
  <div class="row" id="message">-</div>
  <script src="popup.js"></script>
</body>
</html>
