<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHubユーザースクリプトローダー</title>
  <style>
    body{width:360px;margin:0;padding:16px;font-family:sans-serif;background:#fff;color:#111}h1{font-size:18px;margin:0 0 12px}.card{border:1px solid #ddd;border-radius:10px;padding:12px;margin:10px 0}.row{margin:6px 0;line-height:1.5;word-break:break-word}.label{font-weight:700}.ok{color:#087f23}.error{color:#b00020}.stopped{color:#b26a00}button{width:100%;padding:10px;border:0;border-radius:8px;background:#111;color:#fff;font-weight:700;cursor:pointer}button:disabled{opacity:.5;cursor:default}ul{margin:8px 0 0;padding-left:20px}
  </style>
</head>
<body>
  <h1>GitHubユーザースクリプトローダー</h1>
  <div class="card">
    <div class="row"><span class="label">状態：</span><span id="state">確認中</span></div>
    <div class="row"><span class="label">緊急停止：</span><span id="stop">-</span></div>
    <div class="row"><span class="label">設定元：</span><span id="configSource">-</span></div>
    <div class="row"><span class="label">最終処理：</span><span id="updatedAt">-</span></div>
    <div class="row"><span class="label">メッセージ：</span><span id="message">-</span></div>
  </div>
  <div class="card">
    <div class="label">最終実行結果</div>
    <ul id="results"><li>記録なし</li></ul>
  </div>
  <button id="runNow">今すぐ確認</button>
  <script src="popup.js"></script>
</body>
</html>
